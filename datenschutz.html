<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Datenschutzerklärung – Slow Orbit</title><meta name="description" content="Datenschutzerklärung für Slow Orbit"><style>*{box-sizing:border-box}body{margin:0;background:#0e1d19;color:#eeeae0;font:17px/1.7 system-ui,-apple-system,Segoe UI,sans-serif}a{color:#a6d5bc;overflow-wrap:anywhere}.top{border-bottom:1px solid #315048;background:#14271f}.nav{max-width:890px;margin:auto;padding:16px 24px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}.brand{font-size:22px;color:#f1eddf;font-weight:700;margin-right:auto;text-decoration:none}.container{max-width:890px;margin:auto;padding:38px 24px 65px}.header{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.eyebrow{color:#a5c7b2;margin:0}h1{font-size:clamp(30px,5vw,45px);line-height:1.15;margin:8px 0 12px}h2{font-size:22px;line-height:1.3;color:#f1eacf;margin:0 0 12px}.date{color:#bbccc1;margin:0 0 25px}.section{border-top:1px solid #345048;padding:23px 0}.body{white-space:pre-line;overflow-wrap:anywhere}.body a{word-break:break-word}.select{background:#263f34;color:#fff;border:1px solid #638477;border-radius:9px;padding:12px;font:inherit;min-width:190px}footer{border-top:1px solid #345048;padding:25px 0;color:#c7d1c9}.note{background:#20382c;padding:12px 15px;border-left:3px solid #85b99f;border-radius:6px;color:#e8ede8;font-size:14px;margin-bottom:23px}</style></head><body><header class="top"><nav class="nav"><a class="brand" href="index.html">slow orbit</a><a href="support.html">Support</a><a href="datenschutz.html">Datenschutz</a><a href="impressum.html">Impressum</a></nav></header><main class="container"><div class="header"><div><p class="eyebrow">Slow Orbit</p><h1 id="heading">Datenschutzerklärung</h1><p class="date" id="date">Stand: 7. November 2026</p></div><div><label for="lang">Sprache / Language</label><div><select class="select" id="lang" aria-label="Sprache auswählen"></select></div></div></div><div id="note" class="note" hidden></div><div id="sections"></div><footer>© 2026 Felix Steinecke · <a href="impressum.html">Impressum</a> · <a href="support.html">Support</a></footer></main><script>const data={"de": {"name": "Deutsch", "title": "Datenschutzerklärung", "date": "Stand: 7. November 2026", "sections": [["Verantwortlicher", "Felix Steinecke\nSteinbacher Weg 25\n01723 Kesselsdorf, Deutschland\nE-Mail: felixsteinecke@hotmail.de"], ["Kurz zusammengefasst", "Slow Orbit funktioniert ohne Konto, ohne eigene Server und ohne Tracking. Deine Fotos, das Kamerabild und deine Einstellungen werden ausschließlich auf deinem iPhone verarbeitet. Wir als Anbieter erhalten keine personenbezogenen Daten von dir. Die einzige Verbindung ins Internet besteht beim Prüfen und Laden von App-Updates (Abschnitt 6)."], ["Daten, die nur auf deinem iPhone gespeichert werden", "Folgende Daten speichert die App lokal auf deinem Gerät. Sie werden weder an uns noch an Dritte übertragen:\n• Fotos und Referenzbilder, die du in der App aufnimmst oder auswählst, sowie daraus berechnete Bildmerkmale für die Wiedererkennung.\n• Deine Zeitkonten (Name, Symbol, Minuten pro Tag) und Einstellungen wie Anzahl der Liegestütze, Toleranzen, Sprache und Darstellung.\n• Ein optionales Passwort – nicht im Klartext, sondern nur als gesalzener Prüfwert (Hash) im iOS-Schlüsselbund.\n• Die Auswahl der Apps, die pausiert werden sollen (Abschnitt 5).\nRechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO (Bereitstellung der von dir gewünschten Funktionen). Du kannst alle Daten jederzeit löschen, indem du sie in der App entfernst oder die App deinstallierst."], ["Kamera", "Die App nutzt die Kamera nur, wenn du sie aktiv öffnest: zum Aufnehmen von Referenzbildern, zum Wiedererkennen deines Bildes im Livebild und zum Zählen von Liegestützen. Für die Liegestütze erkennt Apple Vision Körperpunkte (z. B. Schultern, Ellbogen, Hände); daraus wird die Bewegung berechnet. Das Livebild wird ausschließlich in Echtzeit auf dem Gerät ausgewertet und weder gespeichert noch übertragen. Den Kamerazugriff kannst du jederzeit in den iOS-Einstellungen widerrufen."], ["Bildschirmzeit (Apple Family Controls)", "Zum Pausieren von Apps nutzt Slow Orbit die Bildschirmzeit-Schnittstelle von Apple. Die Auswahl der Apps erfolgt in einem Dialog von Apple. Die App erhält dabei nur anonyme Kennungen, aber keine Namen der gewählten Apps und keine Nutzungsdaten. Die Überwachung der Zeitkonten läuft vollständig auf deinem iPhone. Die Berechtigung kannst du in den iOS-Einstellungen unter „Bildschirmzeit“ widerrufen."], ["App-Updates über Expo", "Damit Verbesserungen ohne neue Installation bereitgestellt werden können, prüft die App beim Start und auf deinen Wunsch, ob ein Update vorliegt. Dafür verbindet sie sich mit den Servern von Expo (650 Industries, Inc., USA). Dabei werden technisch notwendige Daten übertragen: IP-Adresse, Plattform (iOS), App-Version, Update-Kanal und Update-Kennung. Fotos oder andere Inhalte werden nicht übertragen.\nRechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO; unser berechtigtes Interesse ist eine sichere und fehlerfreie App. Expo kann die Daten in den USA verarbeiten. Die Übermittlung erfolgt auf Grundlage geeigneter Garantien nach Art. 46 DSGVO (EU-Standardvertragsklauseln) bzw. des EU-U.S. Data Privacy Framework, soweit Expo daran teilnimmt. Datenschutzhinweise von Expo: https://expo.dev/privacy"], ["Apple App Store", "Für Download, Kauf und Aktualisierung der App über den App Store ist Apple verantwortlich. Apple kann uns zusammengefasste, nicht personenbezogene Statistiken (z. B. Downloadzahlen) und – nur wenn du dem auf deinem iPhone zugestimmt hast – anonyme Absturzberichte bereitstellen. Datenschutzrichtlinie von Apple: https://www.apple.com/de/legal/privacy/"], ["Kein Tracking, keine Werbung", "Slow Orbit enthält keine Werbung, keine Analyse- oder Tracking-Dienste und gibt keine Daten an Dritte weiter oder verkauft sie."], ["Kinder", "Die App erhebt keine personenbezogenen Daten, auch nicht von Kindern."], ["Deine Rechte", "Du hast nach der DSGVO das Recht auf Auskunft (Art. 15), Berichtigung (Art. 16), Löschung (Art. 17), Einschränkung der Verarbeitung (Art. 18), Datenübertragbarkeit (Art. 20) und Widerspruch (Art. 21). Da wir selbst keine personenbezogenen Daten von dir speichern, betreffen diese Rechte vor allem die in Abschnitt 6 und 7 genannten Anbieter. Bei Fragen wende dich gern an felixsteinecke@hotmail.de. Du hast außerdem das Recht, dich bei einer Datenschutz-Aufsichtsbehörde zu beschweren."], ["Änderungen", "Wir passen diese Datenschutzerklärung an, wenn sich die App oder die Rechtslage ändert. Es gilt die jeweils aktuelle Fassung auf dieser Seite."]]}, "en": {"name": "English", "title": "Privacy Policy", "date": "Last updated: 7 November 2026", "sections": [["Controller", "Felix Steinecke\nSteinbacher Weg 25\n01723 Kesselsdorf, Germany\nEmail: felixsteinecke@hotmail.de"], ["Summary", "Slow Orbit works without an account, without our own servers and without tracking. Your photos, the camera image and your settings are processed exclusively on your iPhone. We do not receive any personal data from you. The only internet connection is used to check for and download app updates (section 6)."], ["Data stored only on your iPhone", "The app stores the following data locally on your device. It is not sent to us or third parties:\n• Photos and reference pictures you take or select, and image features derived from them for recognition.\n• Your time accounts (name, icon, minutes per day) and settings, such as number of push-ups, tolerances, language and appearance.\n• An optional password, stored only as a salted hash in the iOS Keychain, not in plain text.\n• Your selection of apps to pause (section 5).\nLegal basis: Art. 6(1)(b) GDPR (providing the requested features). You can delete this data in the app or by uninstalling it."], ["Camera", "The camera is used only when you actively open it: to take reference pictures, recognise your picture in the live camera image and count push-ups. For push-ups, Apple Vision detects body points (e.g. shoulders, elbows and hands) to measure the movement. The live image is analysed in real time on your device and is neither stored nor transmitted. You may revoke camera access in iOS Settings."], ["Screen Time (Apple Family Controls)", "Slow Orbit uses Apple’s Screen Time interface to pause apps. Apps are selected in an Apple dialog; the app receives only anonymous tokens, not the names of selected apps or usage data. Monitoring of time accounts runs entirely on your iPhone. You can revoke the permission under Screen Time in iOS Settings."], ["App updates via Expo", "To deliver improvements without reinstalling, the app checks for updates at launch and when requested by connecting to Expo servers (650 Industries, Inc., USA). Technically necessary data is transmitted: IP address, platform (iOS), app version, update channel and update ID. No photos or other content are sent.\nLegal basis: Art. 6(1)(f) GDPR (our legitimate interest in a secure, reliable app). Expo may process data in the USA. Transfers are based on appropriate safeguards under Art. 46 GDPR (EU Standard Contractual Clauses) or the EU–US Data Privacy Framework where Expo participates. Expo privacy policy: https://expo.dev/privacy"], ["Apple App Store", "Apple is responsible for downloading, purchasing and updating the app through the App Store. Apple may provide us with aggregated, non-personal statistics (such as download counts) and, only with your consent on your iPhone, anonymous crash reports. Apple privacy policy: https://www.apple.com/legal/privacy/"], ["No tracking, no ads", "Slow Orbit contains no advertising, analytics or tracking services and does not share or sell data to third parties."], ["Children", "The app does not collect personal data, including from children."], ["Your rights", "Under the GDPR, you have rights of access (Art. 15), rectification (Art. 16), erasure (Art. 17), restriction of processing (Art. 18), data portability (Art. 20) and objection (Art. 21). As we do not store your personal data ourselves, these rights mainly concern the providers in sections 6 and 7. For questions, contact felixsteinecke@hotmail.de. You may also lodge a complaint with a data protection supervisory authority."], ["Changes", "We update this privacy policy if the app or legal requirements change. The latest version on this page applies."]]}, "fr": {"name": "Français", "title": "Politique de confidentialité", "date": "Mise à jour : 7 novembre 2026", "sections": [["Responsable du traitement", "Felix Steinecke\nSteinbacher Weg 25\n01723 Kesselsdorf, Germany\nEmail: felixsteinecke@hotmail.de"], ["En bref", "Slow Orbit fonctionne sans compte, sans serveurs propres et sans suivi. Vos photos, les images de la caméra et vos réglages sont traités uniquement sur votre iPhone. Nous ne recevons aucune donnée personnelle de votre part. La seule connexion Internet sert à vérifier et télécharger les mises à jour de l’application (section 6)."], ["Données stockées uniquement sur votre iPhone", "L’application conserve localement les données suivantes, sans les transmettre à nous ni à des tiers :\n• Photos et images de référence choisies ou prises dans l’application, ainsi que les caractéristiques d’image calculées pour les reconnaître.\n• Vos budgets de temps (nom, icône, minutes par jour) et réglages : nombre de pompes, tolérances, langue et apparence.\n• Un mot de passe facultatif, conservé uniquement sous forme d’empreinte cryptographique salée dans le trousseau iOS, jamais en clair.\n• Les applications que vous choisissez de mettre en pause (section 5).\nBase juridique : art. 6, § 1, point b du RGPD (fourniture des fonctions demandées). Vous pouvez supprimer ces données dans l’application ou en la désinstallant."], ["Caméra", "La caméra est utilisée uniquement lorsque vous l’ouvrez activement : pour prendre des images de référence, les reconnaître en direct et compter les pompes. Pour celles-ci, Apple Vision détecte des points du corps (épaules, coudes, mains, par exemple) afin de mesurer les mouvements. Le flux vidéo est analysé en temps réel sur l’appareil, sans être enregistré ni transmis. Vous pouvez retirer l’autorisation dans les réglages iOS."], ["Temps d’écran (Apple Family Controls)", "Slow Orbit utilise l’interface Temps d’écran d’Apple pour mettre des apps en pause. La sélection s’effectue dans une fenêtre Apple. L’application ne reçoit que des identifiants anonymes, jamais les noms des apps choisies ni les données d’utilisation. Le suivi des budgets de temps s’effectue entièrement sur votre iPhone. Vous pouvez révoquer l’autorisation dans les réglages iOS, rubrique Temps d’écran."], ["Mises à jour via Expo", "Pour fournir des améliorations sans réinstallation, l’application recherche des mises à jour au lancement et à votre demande, en contactant les serveurs d’Expo (650 Industries, Inc., États-Unis). Les données techniques nécessaires sont transmises : adresse IP, plateforme (iOS), version de l’app, canal de mise à jour et identifiant de mise à jour. Aucune photo ni autre contenu n’est envoyé.\nBase juridique : art. 6, § 1, point f du RGPD (intérêt légitime à fournir une application sûre et fiable). Expo peut traiter les données aux États-Unis. Les transferts reposent sur les garanties appropriées de l’art. 46 du RGPD (clauses contractuelles types de l’UE), ou sur le cadre UE–États-Unis de protection des données si Expo y participe. Politique d’Expo : https://expo.dev/privacy"], ["App Store d’Apple", "Apple est responsable du téléchargement, de l’achat et de la mise à jour de l’application via l’App Store. Apple peut nous communiquer des statistiques agrégées non personnelles (par ex. le nombre de téléchargements) et, uniquement avec votre accord sur l’iPhone, des rapports de plantage anonymes. Politique d’Apple : https://www.apple.com/legal/privacy/"], ["Aucun suivi, aucune publicité", "Slow Orbit ne contient ni publicité, ni service d’analyse ou de suivi, et ne transmet ni ne vend de données à des tiers."], ["Enfants", "L’application ne collecte aucune donnée personnelle, y compris concernant les enfants."], ["Vos droits", "En vertu du RGPD, vous disposez de droits d’accès (art. 15), de rectification (art. 16), d’effacement (art. 17), de limitation (art. 18), de portabilité (art. 20) et d’opposition (art. 21). Puisque nous ne stockons pas nous-mêmes vos données personnelles, ces droits concernent principalement les prestataires cités aux sections 6 et 7. Contact : felixsteinecke@hotmail.de. Vous pouvez aussi déposer une plainte auprès d’une autorité de contrôle de la protection des données."], ["Modifications", "Nous adaptons cette politique si l’application ou la législation évolue. La version actuelle publiée sur cette page s’applique."]]}, "es": {"name": "Español", "title": "Política de privacidad", "date": "Actualizado: 7 de noviembre de 2026", "sections": [["Responsable", "Felix Steinecke\nSteinbacher Weg 25\n01723 Kesselsdorf, Germany\nEmail: felixsteinecke@hotmail.de"], ["Resumen", "Slow Orbit funciona sin cuenta, sin servidores propios y sin seguimiento. Tus fotos, las imágenes de la cámara y los ajustes se procesan exclusivamente en tu iPhone. No recibimos datos personales tuyos. La única conexión a Internet se utiliza para comprobar y descargar actualizaciones de la app (apartado 6)."], ["Datos almacenados solo en tu iPhone", "La app almacena localmente los siguientes datos, sin enviárnoslos ni compartirlos con terceros:\n• Fotos e imágenes de referencia tomadas o seleccionadas, y características de imagen calculadas para reconocerlas.\n• Tus cuentas de tiempo (nombre, icono, minutos diarios) y ajustes como número de flexiones, tolerancias, idioma y apariencia.\n• Una contraseña opcional, guardada únicamente como hash con sal en el llavero de iOS, nunca en texto plano.\n• La selección de apps que quieres pausar (apartado 5).\nBase jurídica: art. 6.1.b del RGPD (prestación de las funciones solicitadas). Puedes borrar los datos desde la app o desinstalándola."], ["Cámara", "La cámara solo se utiliza cuando la abres activamente: para tomar imágenes de referencia, reconocerlas en directo y contar flexiones. Para las flexiones, Apple Vision detecta puntos corporales (como hombros, codos y manos) y calcula el movimiento. La imagen se analiza en tiempo real en el dispositivo, sin almacenarse ni transmitirse. Puedes revocar el permiso en Ajustes de iOS."], ["Tiempo de uso (Apple Family Controls)", "Slow Orbit utiliza la interfaz Tiempo de uso de Apple para pausar apps. La selección se realiza en un cuadro de diálogo de Apple. La app solo recibe identificadores anónimos, nunca los nombres de las apps ni datos de uso. El control de las cuentas de tiempo se ejecuta íntegramente en tu iPhone. Puedes revocar el permiso desde Tiempo de uso en Ajustes de iOS."], ["Actualizaciones mediante Expo", "Para ofrecer mejoras sin reinstalar la app, se comprueban las actualizaciones al iniciarla y cuando lo solicitas, conectándose a los servidores de Expo (650 Industries, Inc., EE. UU.). Se transmiten datos técnicos necesarios: dirección IP, plataforma (iOS), versión de la app, canal de actualización e identificador de actualización. No se envían fotos ni otros contenidos.\nBase jurídica: art. 6.1.f del RGPD (interés legítimo en una app segura y fiable). Expo puede tratar datos en EE. UU. Las transferencias se basan en garantías adecuadas conforme al art. 46 del RGPD (cláusulas contractuales tipo de la UE) o en el Marco de Privacidad de Datos UE-EE. UU., si Expo participa. Política de Expo: https://expo.dev/privacy"], ["App Store de Apple", "Apple es responsable de las descargas, compras y actualizaciones de la app en App Store. Puede facilitarnos estadísticas agregadas no personales (por ejemplo, descargas) y, solo si lo has consentido en tu iPhone, informes de fallos anónimos. Política de Apple: https://www.apple.com/legal/privacy/"], ["Sin seguimiento ni publicidad", "Slow Orbit no contiene anuncios ni servicios de análisis o seguimiento, y no comparte ni vende datos a terceros."], ["Menores", "La app no recopila datos personales, tampoco de menores."], ["Tus derechos", "Según el RGPD, tienes derecho de acceso (art. 15), rectificación (art. 16), supresión (art. 17), limitación del tratamiento (art. 18), portabilidad (art. 20) y oposición (art. 21). Como no almacenamos tus datos personales, estos derechos afectan principalmente a los proveedores de los apartados 6 y 7. Contacto: felixsteinecke@hotmail.de. También puedes reclamar ante una autoridad de protección de datos."], ["Cambios", "Actualizaremos esta política si cambia la app o la legislación. Se aplica la versión vigente publicada en esta página."]]}, "it": {"name": "Italiano", "title": "Informativa sulla privacy", "date": "Aggiornata il 7 novembre 2026", "sections": [["Titolare del trattamento", "Felix Steinecke\nSteinbacher Weg 25\n01723 Kesselsdorf, Germany\nEmail: felixsteinecke@hotmail.de"], ["In breve", "Slow Orbit funziona senza account, senza server propri e senza tracciamento. Foto, immagini della fotocamera e impostazioni vengono elaborate esclusivamente sul tuo iPhone. Non riceviamo dati personali da te. L’unica connessione Internet serve a verificare e scaricare aggiornamenti dell’app (sezione 6)."], ["Dati salvati solo sul tuo iPhone", "L’app salva localmente questi dati, senza trasmetterli a noi o a terzi:\n• Foto e immagini di riferimento scattate o selezionate, e caratteristiche calcolate per riconoscerle.\n• Contatori di tempo (nome, icona, minuti al giorno) e impostazioni, incluse flessioni, tolleranze, lingua e aspetto.\n• Una password facoltativa, conservata solo come hash salato nel Portachiavi iOS, non in chiaro.\n• Le app selezionate per la pausa (sezione 5).\nBase giuridica: art. 6, par. 1, lett. b GDPR (fornitura delle funzioni richieste). Puoi cancellare i dati nell’app o disinstallandola."], ["Fotocamera", "La fotocamera viene usata soltanto quando la apri: per acquisire immagini di riferimento, riconoscerle dal vivo e contare le flessioni. Apple Vision identifica punti del corpo (come spalle, gomiti e mani) per calcolare il movimento. Il video viene analizzato in tempo reale sul dispositivo, senza essere memorizzato né trasmesso. Puoi revocare l’accesso nelle Impostazioni iOS."], ["Tempo di utilizzo (Apple Family Controls)", "Slow Orbit usa l’interfaccia Tempo di utilizzo di Apple per mettere in pausa le app. La selezione avviene in una finestra Apple. L’app riceve solo identificatori anonimi, non i nomi delle app selezionate né dati d’uso. Il monitoraggio dei contatori avviene interamente sull’iPhone. Puoi revocare il permesso dalle Impostazioni iOS, in Tempo di utilizzo."], ["Aggiornamenti tramite Expo", "Per offrire miglioramenti senza reinstallare, l’app verifica gli aggiornamenti all’avvio e su richiesta collegandosi ai server Expo (650 Industries, Inc., USA). Vengono trasmessi dati tecnici necessari: indirizzo IP, piattaforma (iOS), versione dell’app, canale e identificativo dell’aggiornamento. Non vengono inviati foto o altri contenuti.\nBase giuridica: art. 6, par. 1, lett. f GDPR (legittimo interesse a un’app sicura e affidabile). Expo può trattare i dati negli USA. I trasferimenti si basano su garanzie adeguate ai sensi dell’art. 46 GDPR (clausole contrattuali standard UE) oppure sul Data Privacy Framework UE-USA, se Expo vi aderisce. Informativa Expo: https://expo.dev/privacy"], ["Apple App Store", "Apple è responsabile di download, acquisti e aggiornamenti tramite App Store. Può fornirci statistiche aggregate non personali (ad esempio il numero di download) e, solo con il tuo consenso sull’iPhone, segnalazioni anonime di arresti anomali. Privacy Apple: https://www.apple.com/legal/privacy/"], ["Nessun tracciamento o pubblicità", "Slow Orbit non contiene pubblicità, servizi di analisi o tracciamento e non condivide né vende dati a terzi."], ["Minori", "L’app non raccoglie dati personali, neanche di minori."], ["I tuoi diritti", "Ai sensi del GDPR hai diritto di accesso (art. 15), rettifica (art. 16), cancellazione (art. 17), limitazione (art. 18), portabilità (art. 20) e opposizione (art. 21). Poiché non conserviamo i tuoi dati personali, questi diritti riguardano soprattutto i fornitori delle sezioni 6 e 7. Contatto: felixsteinecke@hotmail.de. Puoi inoltre presentare reclamo all’autorità di protezione dei dati."], ["Modifiche", "Aggiorniamo questa informativa se cambiano l’app o le norme. Vale la versione corrente pubblicata su questa pagina."]]}, "pt": {"name": "Português", "title": "Política de privacidade", "date": "Atualizado em 7 de novembro de 2026", "sections": [["Responsável pelo tratamento", "Felix Steinecke\nSteinbacher Weg 25\n01723 Kesselsdorf, Germany\nEmail: felixsteinecke@hotmail.de"], ["Resumo", "Slow Orbit funciona sem conta, sem servidores próprios e sem rastreamento. Suas fotos, imagens da câmera e configurações são processadas exclusivamente no iPhone. Não recebemos seus dados pessoais. A única conexão com a internet serve para verificar e baixar atualizações do aplicativo (seção 6)."], ["Dados armazenados apenas no iPhone", "O aplicativo armazena localmente os seguintes dados, sem transmiti-los a nós ou a terceiros:\n• Fotos e imagens de referência tiradas ou escolhidas, e características extraídas para reconhecê-las.\n• Seus saldos de tempo (nome, ícone, minutos por dia) e configurações como número de flexões, tolerâncias, idioma e aparência.\n• Senha opcional, guardada somente como hash com salt no Chaves do iOS, nunca em texto simples.\n• Apps selecionados para pausa (seção 5).\nBase legal: art. 6(1)(b) do GDPR (fornecimento das funcionalidades solicitadas). Você pode excluir os dados no app ou desinstalando-o."], ["Câmera", "A câmera é usada apenas quando você a abre: para capturar imagens de referência, reconhecê-las ao vivo e contar flexões. O Apple Vision identifica pontos do corpo (como ombros, cotovelos e mãos) para calcular o movimento. A imagem ao vivo é analisada em tempo real no aparelho, sem ser armazenada ou transmitida. Você pode revogar a permissão nos Ajustes do iOS."], ["Tempo de Uso (Apple Family Controls)", "Slow Orbit usa a interface Tempo de Uso da Apple para pausar apps. A seleção ocorre em uma janela da Apple. O app recebe apenas identificadores anônimos, não os nomes dos aplicativos escolhidos nem dados de uso. O acompanhamento dos saldos de tempo ocorre inteiramente no iPhone. Você pode revogar a permissão em Tempo de Uso nos Ajustes do iOS."], ["Atualizações pelo Expo", "Para disponibilizar melhorias sem reinstalação, o app verifica atualizações na inicialização e quando solicitado, conectando-se aos servidores da Expo (650 Industries, Inc., EUA). São transmitidos dados técnicos necessários: endereço IP, plataforma (iOS), versão do app, canal e identificador da atualização. Nenhuma foto ou outro conteúdo é enviado.\nBase legal: art. 6(1)(f) do GDPR (interesse legítimo em um app seguro e confiável). A Expo pode processar dados nos EUA. As transferências seguem garantias adequadas do art. 46 do GDPR (cláusulas contratuais padrão da UE) ou o Data Privacy Framework UE-EUA, quando aplicável à Expo. Privacidade Expo: https://expo.dev/privacy"], ["Apple App Store", "A Apple é responsável por downloads, compras e atualizações via App Store. Pode fornecer estatísticas agregadas não pessoais (como número de downloads) e, apenas com seu consentimento no iPhone, relatórios anônimos de falhas. Privacidade Apple: https://www.apple.com/legal/privacy/"], ["Sem rastreamento nem anúncios", "Slow Orbit não contém publicidade nem serviços de análise ou rastreamento e não compartilha nem vende dados a terceiros."], ["Crianças", "O app não coleta dados pessoais, inclusive de crianças."], ["Seus direitos", "De acordo com o GDPR, você tem direito de acesso (art. 15), retificação (art. 16), exclusão (art. 17), restrição (art. 18), portabilidade (art. 20) e oposição (art. 21). Como não armazenamos seus dados pessoais, esses direitos dizem respeito principalmente aos prestadores citados nas seções 6 e 7. Contato: felixsteinecke@hotmail.de. Você também pode apresentar reclamação a uma autoridade de proteção de dados."], ["Alterações", "Atualizaremos esta política se o app ou a legislação mudar. Vale a versão atual publicada nesta página."]]}};const select=document.getElementById('lang');const supported=['de','en','fr','es','it','pt'];for(const code of supported){const o=document.createElement('option');o.value=code;o.textContent=data[code].name;select.appendChild(o)}function linkify(text){const re=/(https:\/\/[^\s]+|felixsteinecke@hotmail\.de)/g;const root=document.createDocumentFragment();let start=0;for(const m of text.matchAll(re)){root.append(document.createTextNode(text.slice(start,m.index)));const a=document.createElement('a');a.href=m[0].startsWith('https://')?m[0]:'mailto:'+m[0];a.textContent=m[0];if(a.href.startsWith('https://'))a.rel='noopener noreferrer';root.append(a);start=m.index+m[0].length}root.append(document.createTextNode(text.slice(start)));return root}function render(lang,writeUrl=false){const d=data[lang]||data.en;document.documentElement.lang=lang;select.value=lang;document.getElementById('heading').textContent=d.title;document.getElementById('date').textContent=d.date;document.title=d.title+' – Slow Orbit';const sections=document.getElementById('sections');sections.replaceChildren();for(let i=0;i<d.sections.length;i++){const wrap=document.createElement('section');wrap.className='section';const h=document.createElement('h2');h.textContent=(i+1)+'. '+d.sections[i][0];const content=document.createElement('div');content.className='body';content.append(linkify(d.sections[i][1]));wrap.append(h,content);sections.append(wrap)}if(writeUrl){const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState({},'',url)}}let requested=new URLSearchParams(location.search).get('lang')||navigator.language||'de';requested=requested.toLowerCase();let chosen=Object.keys(data).find(k=>requested===k||requested.startsWith(k+'-'));if(!chosen)chosen='en';render(chosen);select.addEventListener('change',()=>render(select.value,true));</script></body></html>
